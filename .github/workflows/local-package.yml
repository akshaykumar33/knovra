name: Knovra Local Package

on:
  push:
    paths: ['packages/local/**', '.github/workflows/local-package.yml']
  pull_request:
    paths: ['packages/local/**', '.github/workflows/local-package.yml']

jobs:
  package:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['24.x']
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: packages/local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm run check
      - run: npm test
      - run: npm pack --dry-run
