name: knovra-infra

services:
  # ----------------------------------------------------------------------------
  # PostgreSQL 16 with pgvector extension (Primary transactional & vector memory)
  # ----------------------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg16
    container_name: knovra-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-knovra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-knovra_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-knovra}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-postgres.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-knovra} -d ${POSTGRES_DB:-knovra}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - knovra-network

  # ----------------------------------------------------------------------------
  # Neo4j 5 Community (Provenance-aware Context Knowledge Graph)
  # ----------------------------------------------------------------------------
  neo4j:
    image: neo4j:5.26-community
    container_name: knovra-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-knovra_dev_password}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*"
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_BOLT_PORT:-7687}:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:7474"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - knovra-network

  # ----------------------------------------------------------------------------
  # Redis 7 (Ephemeral Cache, Distributed Locks & Working Memory)
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: knovra-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - knovra-network

  # ----------------------------------------------------------------------------
  # NATS JetStream (High-throughput Event Streaming Backbone)
  # ----------------------------------------------------------------------------
  nats:
    image: nats:2.10-alpine
    container_name: knovra-nats
    restart: unless-stopped
    command: ["-js", "-m", "8222"]
    ports:
      - "${NATS_PORT:-4222}:4222"
      - "${NATS_MONITOR_PORT:-8222}:8222"
    volumes:
      - nats_data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/varz"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - knovra-network

  # ----------------------------------------------------------------------------
  # MinIO (S3-compatible Object Storage for Large Transcripts & Snapshots)
  # ----------------------------------------------------------------------------
  minio:
    image: minio/minio:latest
    container_name: knovra-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - knovra-network

networks:
  knovra-network:
    name: knovra-network
    driver: bridge

volumes:
  postgres_data:
  neo4j_data:
  neo4j_logs:
  redis_data:
  nats_data:
  minio_data:
